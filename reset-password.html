<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تعيين كلمة مرور جديدة | The Mayyar Palette</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --matte-black:#0C0C0C; --warm-beige:#E6D5C3; --pure-white:#FFFFFF;
  --panel:rgba(255,255,255,.03); --line:rgba(230,213,195,.18); --muted:#8f8779; --text-soft:#cfc6bb;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--matte-black);color:var(--pure-white);font-family:'Cairo',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;overflow-x:hidden;}
::selection{background:var(--warm-beige);color:var(--matte-black);}
a{color:inherit;}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--warm-beige);outline-offset:3px;}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.001ms !important;transition-duration:.001ms !important;}}

.top-bar{position:fixed;top:0;left:0;width:100%;padding:1.4rem 5%;display:flex;justify-content:space-between;align-items:center;z-index:10;}
.logo{font-family:'Cinzel',serif;font-size:1.3rem;font-weight:600;letter-spacing:3px;color:var(--warm-beige);text-decoration:none;}
.back-link{font-size:.85rem;color:var(--text-soft);text-decoration:none;transition:.25s;}
.back-link:hover{color:var(--warm-beige);}

.card{
  width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:16px;
  padding:2.6rem 2.2rem;opacity:0;animation:cardIn .7s .1s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes cardIn{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
.icon-badge{
  width:52px;height:52px;border-radius:50%;border:1px solid var(--warm-beige);display:flex;align-items:center;justify-content:center;
  font-size:1.3rem;color:var(--warm-beige);margin-bottom:1.4rem;
}
.card h1{font-family:'Cinzel',serif;font-size:1.5rem;font-weight:600;color:var(--warm-beige);letter-spacing:1px;}
.card .sub{color:var(--muted);font-size:.9rem;margin-top:.7rem;line-height:1.9;}

.field{margin-top:1.6rem;position:relative;}
.field label{display:block;font-size:.8rem;color:var(--text-soft);margin-bottom:.5rem;}
.field input{
  width:100%;background:rgba(255,255,255,.02);border:1px solid var(--line);color:var(--pure-white);
  padding:.9rem 1rem;font-family:'Cairo',sans-serif;font-size:.95rem;border-radius:6px;transition:.25s;
}
.field input::placeholder{color:#5c584f;}
.field input:focus{border-color:var(--warm-beige);background:rgba(230,213,195,.05);}
.field .toggle-pass{position:absolute;left:.9rem;top:2.4rem;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.78rem;}
.field .toggle-pass:hover{color:var(--warm-beige);}
.field-error{color:#e08a7d;font-size:.78rem;margin-top:.45rem;display:none;}
.field.invalid input{border-color:#e08a7d;}
.field.invalid .field-error{display:block;}

.strength{margin-top:.7rem;display:flex;gap:5px;}
.strength span{height:3px;flex:1;background:var(--line);border-radius:2px;transition:.3s;}
.strength-label{font-size:.74rem;color:var(--muted);margin-top:.4rem;}

.btn-primary{
  margin-top:1.8rem;width:100%;padding:1rem;background:var(--warm-beige);border:none;color:var(--matte-black);
  font-family:'Cinzel',serif;font-weight:600;letter-spacing:2px;font-size:.85rem;text-transform:uppercase;
  border-radius:6px;cursor:pointer;transition:.3s;position:relative;overflow:hidden;
}
.btn-primary:hover{background:#f0e4d6;transform:translateY(-1px);}
.btn-primary.loading{color:transparent;pointer-events:none;}
.btn-primary.loading::after{
  content:'';position:absolute;inset:0;margin:auto;width:18px;height:18px;border-radius:50%;
  border:2px solid rgba(12,12,12,.25);border-top-color:var(--matte-black);animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
.link-beige{color:var(--warm-beige);text-decoration:none;border-bottom:1px solid transparent;}
.link-beige:hover{border-color:var(--warm-beige);}

.step{display:none;}
.step.active{display:block;}
.success-icon{
  width:52px;height:52px;border-radius:50%;background:rgba(230,213,195,.15);border:1px solid var(--warm-beige);
  display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--warm-beige);margin-bottom:1.4rem;
}
.switch-line{text-align:center;margin-top:1.8rem;font-size:.88rem;color:var(--muted);}
</style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="logo">MAYYAR</a>
  <a href="login.html" class="back-link">→ العودة لتسجيل الدخول</a>
</div>

<div class="card">
  <div class="step active" id="stepForm">
    <div class="icon-badge">🔑</div>
    <h1>تعيين كلمة مرور جديدة</h1>
    <p class="sub">اختاري كلمة مرور قوية لحماية حسابك على The Mayyar Palette.</p>

    <form id="resetForm" novalidate>
      <div class="field" id="passField">
        <label for="password">كلمة المرور الجديدة</label>
        <input type="password" id="password" placeholder="8 أحرف على الأقل" autocomplete="new-password" required>
        <button type="button" class="toggle-pass" id="togglePass">إظهار</button>
        <div class="strength"><span></span><span></span><span></span><span></span></div>
        <div class="strength-label" id="strengthLabel">قوة كلمة المرور</div>
        <div class="field-error">يجب ألا تقل عن 8 أحرف</div>
      </div>

      <div class="field" id="confirmField">
        <label for="confirm">تأكيد كلمة المرور</label>
        <input type="password" id="confirm" placeholder="أعيدي كتابة كلمة المرور" autocomplete="new-password" required>
        <div class="field-error">كلمتا المرور غير متطابقتين</div>
      </div>

      <button type="submit" class="btn-primary" id="resetBtn">تحديث كلمة المرور</button>
    </form>
  </div>

  <div class="step" id="stepDone">
    <div class="success-icon">✓</div>
    <h1>تم تحديث كلمة المرور</h1>
    <p class="sub">يمكنك الآن تسجيل الدخول إلى حسابك بكلمة المرور الجديدة.</p>
    <a href="login.html" class="btn-primary" style="display:block;text-align:center;text-decoration:none;">تسجيل الدخول</a>
  </div>
</div>

<script>
const form = document.getElementById('resetForm');
const password = document.getElementById('password');
const confirm = document.getElementById('confirm');
const strengthBars = document.querySelectorAll('.strength span');
const strengthLabel = document.getElementById('strengthLabel');
const resetBtn = document.getElementById('resetBtn');

document.getElementById('togglePass').addEventListener('click', () => {
  const isPass = password.type === 'password';
  password.type = isPass ? 'text' : 'password';
  document.getElementById('togglePass').textContent = isPass ? 'إخفاء' : 'إظهار';
});

function scorePassword(v){
  let score = 0;
  if(v.length >= 8) score++;
  if(/[A-Z]/.test(v) && /[a-z]/.test(v)) score++;
  if(/\d/.test(v)) score++;
  if(/[^A-Za-z0-9]/.test(v)) score++;
  return score;
}
const strengthColors = ['#e08a7d','#e0b57d','#d9c37a','#8fd6a0'];
const strengthTexts = ['ضعيفة','متوسطة','جيدة','قوية جداً'];

password.addEventListener('input', () => {
  const score = scorePassword(password.value);
  strengthBars.forEach((bar, i) => { bar.style.background = i < score ? strengthColors[Math.max(score-1,0)] : 'var(--line)'; });
  strengthLabel.textContent = password.value.length ? `قوة كلمة المرور: ${strengthTexts[Math.max(score-1,0)] || 'ضعيفة'}` : 'قوة كلمة المرور';
  document.getElementById('passField').classList.remove('invalid');
});

form.addEventListener('submit', (e) => {
  e.preventDefault();
  let valid = true;
  if(password.value.length < 8){ document.getElementById('passField').classList.add('invalid'); valid = false; }
  if(confirm.value !== password.value || !confirm.value){ document.getElementById('confirmField').classList.add('invalid'); valid = false; }
  if(!valid) return;

  resetBtn.classList.add('loading');
  setTimeout(() => {
    document.getElementById('stepForm').classList.remove('active');
    document.getElementById('stepDone').classList.add('active');
  }, 1000);
});

confirm.addEventListener('input', () => document.getElementById('confirmField').classList.remove('invalid'));
</script>
</body>
</html>
