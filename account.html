<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حسابي | The Mayyar Palette</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;900&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{ --matte-black:#0C0C0C; --warm-beige:#E6D5C3; --pure-white:#FFFFFF; --panel:rgba(255,255,255,.03); --line:rgba(230,213,195,.18); --muted:#8f8779; --text-soft:#cfc6bb; }
*{box-sizing:border-box;margin:0;padding:0} 
body{font-family:'Cairo',sans-serif;background:var(--matte-black);color:var(--pure-white);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem;}
a{color:inherit;text-decoration:none}
.card{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:2rem;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.logo{font-family:'Cinzel',serif;font-size:1.3rem;color:var(--warm-beige);letter-spacing:2px;margin-bottom:1rem;display:inline-block}
.title{font-size:1.4rem;font-weight:600;margin-bottom:.4rem}
.sub{color:var(--muted);margin-bottom:1.4rem;line-height:1.8}
.info{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem 1.1rem;margin-top:.9rem}
.info p{margin:.35rem 0;color:var(--text-soft)}
.info strong{color:var(--warm-beige)}
.actions{display:flex;gap:.8rem;margin-top:1.4rem;flex-wrap:wrap}
.btn{padding:.8rem 1rem;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--pure-white);cursor:pointer;font-family:'Cairo',sans-serif}
.btn.primary{background:var(--warm-beige);color:var(--matte-black);border-color:var(--warm-beige);font-weight:700}
.btn:hover{transform:translateY(-1px)}
</style>
</head>
<body>
<div class="card">
  <a href="index.html" class="logo">MAYYAR</a>
  <h1 class="title">حسابي</h1>
  <p class="sub">هذه الصفحة تعرض بياناتك الحالية وتسمح لك بالخروج من الجلسة.</p>
  <div id="accountContent">
    <p>جارٍ تحميل البيانات...</p>
  </div>
</div>
<script>
const AUTH_CURRENT_USER_KEY = 'mayarCurrentUser';
function getCurrentUser(){
  try { return JSON.parse(localStorage.getItem(AUTH_CURRENT_USER_KEY)); } catch { return null; }
}
function renderAccount(){
  const container = document.getElementById('accountContent');
  const user = getCurrentUser();
  if (!user) {
    container.innerHTML = '<p>لا يوجد مستخدم مسجل حالياً.</p><div class="actions"><a class="btn primary" href="signup.html">إنشاء حساب</a><a class="btn" href="login.html">تسجيل الدخول</a></div>';
    return;
  }
  container.innerHTML = `
    <div class="info">
      <p><strong>الاسم:</strong> ${user.fullName || `${user.firstName || ''} ${user.lastName || ''}`.trim()}</p>
      <p><strong>البريد:</strong> ${user.email || '-'}</p>
      <p><strong>تاريخ الإنشاء:</strong> ${user.createdAt ? new Date(user.createdAt).toLocaleString('ar-EG') : '-'}</p>
    </div>
    <div class="actions">
      <a class="btn primary" href="index.html">العودة للمتجر</a>
      <button class="btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
  `;
  document.getElementById('logoutBtn')?.addEventListener('click', () => {
    localStorage.removeItem(AUTH_CURRENT_USER_KEY);
    window.location.href = 'signup.html';
  });
}
renderAccount();
</script>
</body>
</html>
